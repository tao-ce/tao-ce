# https://taskfile.dev

version: '3'

method: checksum
output: prefixed
interval: 1s

env:
  BUILD_NPM_REGISTRY: 'http://npm-registry:4873/'
  BUILD_COMPOSER_REGISTRY: 'http://composer-registry:4060/'

vars:
  CACHE_DIR: '{{.ROOT_DIR}}/.cache/build'
  ROOT_SIGNAL_DIR: '{{.CACHE_DIR}}/signals'
  REGISTRY: localhost/tao-ce

  CE_FLAVOR:
    ref: default "full" (env "CE_FLAVOR")

  SWIFT_IMAGE: tao-ce

  LOCAL_IMAGE: "{{.REGISTRY}}/{{ .SWIFT_IMAGE}}"
  PAYLOAD_IMAGE: "{{.REGISTRY}}/payload/{{ .SWIFT_IMAGE}}"


  BUILD_COMMON_FLAGS:
    - "--build-arg BUILD_NPM_REGISTRY={{ .BUILD_NPM_REGISTRY }}"
    - "--build-arg BUILD_COMPOSER_REGISTRY={{ .BUILD_COMPOSER_REGISTRY }}"
    - "--build-context patches={{.ROOT_DIR}}/hack/patches"
    - " --cpp-flag=-CC"
    - " --cpp-flag=-DTAO_CE_FLAVOR_{{.CE_FLAVOR | upper}}"
    - " --cpp-flag=-I{{.ROOT_DIR}}/build/crystal/Containerfile.d"

  DEV_TAG: dev-latest

  PAYLOAD_CONTAINERFILE: "{{ .CACHE_DIR }}/artifacts/tao-ce.payload.Containerfile"

  APPS_CONTEXTS:
    map:
      construct: "container-image://{{ .REGISTRY }}/apps/construct:{{ .DEV_TAG }}"
      datastore: "container-image://{{ .REGISTRY }}/apps/datastore:{{ .DEV_TAG }}"
      deliver: "container-image://{{ .REGISTRY }}/apps/deliver:{{ .DEV_TAG }}"
      devkit: "container-image://{{ .REGISTRY }}/apps/devkit:{{ .DEV_TAG }}"
      environment-management: "container-image://{{ .REGISTRY }}/apps/environment-management:{{ .DEV_TAG }}"
      dynamic-query: "container-image://{{ .REGISTRY }}/apps/dynamic-query:{{ .DEV_TAG }}"
      task-orchestrator: "container-image://{{ .REGISTRY }}/apps/task-orchestrator:{{ .DEV_TAG }}"
      portal: "container-image://{{ .REGISTRY }}/apps/portal:{{ .DEV_TAG }}"
      timers: "container-image://{{ .REGISTRY }}/apps/timers:{{ .DEV_TAG }}"
      proctoring: "container-image://{{ .REGISTRY }}/apps/proctoring:{{ .DEV_TAG }}"
      content-service: "container-image://{{ .REGISTRY }}/apps/content-service:{{ .DEV_TAG }}"
      scoring: "container-image://{{ .REGISTRY }}/apps/scoring:{{ .DEV_TAG }}"

  FLAVORS_FILE:
    sh: cat ./build/flavors.json

  FLAVORS:
    ref: .FLAVORS_FILE | fromJson

  FLAVOR_APPS:
    ref: >-
      concat
        (get (get .FLAVORS "internal") "apps")
        (get (get .FLAVORS .CE_FLAVOR) "apps")

  APPS:
    ref: .FLAVOR_APPS

includes:
  builds:
    taskfile: ./build/Taskfile.builds.yml

  apps:
    taskfile: ./apps/Taskfile.yml

  packages:
    taskfile: ./packages/Taskfile.yml

  swift:
    taskfile: ./build/swift

  utils:
    taskfile: ./build/utils
    flatten: true

tasks:
  all:clean-start:
    run: once
    cmds:
    - for:
        var: APPS
        as: APP
      task: "apps:{{.APP}}:clean-start"

  all:start:
    deps:
    - for:
        var: APPS
        as: APP
      task: "apps:{{.APP}}:start"

  all:build:
    internal: true
    method: none
    deps:
    - for:
        var: APPS
      task: "apps:{{.ITEM}}:build"

  all:up:
    method: none
    deps:
    - for:
        var: APPS
      task: "apps:{{.ITEM}}:up"

  all:gitref:
    method: none
    deps:
    - for:
        var: APPS
      task: "apps:{{.ITEM}}:gitref"


  dev:wipe:
    desc: Remove all persistent data and config
    ignore_error: true
    prompt:
    - This task will wipe all data from ElasticSearch, do you want to continue?
    - This task will wipe all data from /var/lib/tao-ce, do you want to continue?
    - This task will wipe all data from /etc/tao-ce/setup, do you want to continue?
    cmds:
    - sudo bash /etc/tao-ce/setup/scripts/wipe/es.sh
    - sudo bash /etc/tao-ce/setup/scripts/wipe/data.sh
    - sudo bash /etc/tao-ce/setup/scripts/wipe/config.sh
    - rm -rf {{.ROOT_SIGNAL_DIR}}/apps/*/*/start/*

  dev:down:
    desc: stop all tao-ce services and clean /opt/tao-ce
    ignore_error: true
    prompt:
    - This task will wipe all code from devcontainer, do you want to continue?
    cmds:
    - sudo systemctl stop --no-warn "tao-ce.*.service"
    - sudo systemctl stop --no-warn "tao-ce.*.path" || true
    - sudo systemctl disable --no-warn "tao-ce.*.service"
    - sudo systemctl disable --no-warn "tao-ce.*.path" || true
    - task: dev:wipe
    - sudo rm -rf /opt/tao-ce/* /etc/tao-ce
    - rm -rf {{.ROOT_SIGNAL_DIR}}/apps/*/*/deploy
    - rm -rf {{.ROOT_SIGNAL_DIR}}/apps/*/*/start

  dev:setup:
    desc: restart core services
    method: none
    sources:
      - ./etc/tao-ce
      - ./libexec/init
      - ./libexec/setup

    deps: [dev:sync:etc, dev:sync:libexec]
    cmds:
    - mkdir -p /opt/tao-ce/release && echo "TAO_CE_FLAVOR={{ .CE_FLAVOR }}" >/opt/tao-ce/release/environment
    - sudo systemctl enable --force /usr/local/libexec/tao-ce/systemd/tao-ce.target
    - sudo systemctl enable --force /usr/local/libexec/tao-ce/systemd/tao-ce.setup.service
    - sudo systemctl enable --force /usr/local/libexec/tao-ce/systemd/tao-ce.static.service
    - sudo systemctl enable --force /usr/local/libexec/tao-ce/systemd/tao-ce.healthcheck.service
    - sudo systemctl restart tao-ce.setup.service tao-ce.static.service tao-ce.healthcheck.service

  dev:sync:etc:
    desc: copy etc config files
    method: none
    sources:
    - ./etc/**
    - ./build/crystal/etc/**

    vars:
      TAO_CE_CONFIG_SOURCE:
        sh: cat ./etc/tao-ce/config/tao.yaml

      TAO_CE_CONFIG:
        ref: set (.TAO_CE_CONFIG_SOURCE | fromYaml) "spec" (set (get (.TAO_CE_CONFIG_SOURCE | fromYaml) "spec") "flavor" .CE_FLAVOR)

    cmds:
    - sudo cp -va ./etc/* /etc/
    - |
      tee /etc/tao-ce/config/tao.yaml > /dev/null <<"EOF"
      {{.TAO_CE_CONFIG | toYaml}}
      EOF
    - sudo cp -va ./build/crystal/etc/* /etc/

  dev:sync:libexec:
    desc: copy libexec files
    method: none
    sources:
    - ./libexec/**
    cmds:
    - sudo mkdir -p /usr/local/libexec/tao-ce
    - sudo cp -va ./libexec/* /usr/local/libexec/tao-ce/

  dev:logdy:
    desc: refresh config and start logdy
    sources:
      - ./build/crystal/etc/logdy.config.json
      - ./build/crystal/etc/systemd/system/logdy.service
    deps: [dev:sync:etc, dev:sync:libexec]
    cmds:
      - sudo systemctl daemon-reload
      - sudo systemctl enable --force /etc/systemd/system/logdy.service
      - sudo systemctl restart logdy.service

  dev:init:
    desc: initialize dev environment
    method: none
    cmds:
    - task: dev:logdy
    - task: dev:setup

  dev:up:
    desc: Start all applications, and watch for changes

    method: none

    sources:
      - ./apps/**
      - exclude: .task/**

    deps:
    - task: dev:init
    - task: builds:base:build
    - task: builds:go:build
    cmds:
    - task: packages:all
    - task: _log
      vars:
        MESSAGE: "Updating all apps..."
        APP: "@all"
    - task: all:up
    - task: _log
      vars:
        MESSAGE: "Apps update done"
        APP: "@all"

  dev:prune:
    desc: Remove building cache
    cmds:
    - buildah prune -af
    - buildah rm -a
    - podman system reset -f
    - rm -rf {{.ROOT_SIGNAL_DIR}} .task .cache
