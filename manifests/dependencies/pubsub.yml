
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: pubsub
  name: pubsub
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pubsub
  template:
    metadata:
      labels:
        io.kompose.service: pubsub
    spec:
      containers:
        - image: quay.io/tao-ce/services/pubsub-emulator:latest
          name: pubsub
          env:
          - name: PUBSUB_PORT
            value: "8432"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: pubsub
  name: pubsub
spec:
  ports:
    - name: "8432"
      port: 8432
      targetPort: 8432
  selector:
    io.kompose.service: pubsub
---
