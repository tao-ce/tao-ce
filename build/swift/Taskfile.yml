version: '3'

vars:
  GCR: europe-west1-docker.pkg.dev
  GCP_PROJECT: tao-ce
  
  INTERNAL_REGISTRY: internal
  PUBLIC_REGISTRY: early-adopters

  ENV_REMOTE_REGISTRY:
    ref: env "REMOTE_REGISTRY"

  REMOTE_REGISTRY: "{{ .ENV_REMOTE_REGISTRY | default .PUBLIC_REGISTRY }}"

  TAO_VERSION:
    ref: env "TAO_VERSION"

  CE_MINOR:
    ref: env "CE_MINOR"

  CE_MAJOR:
    ref: env "CE_MAJOR"

  GIT_REF_LONG:
    sh: git rev-parse HEAD

  GIT_REF_SHORT:
    sh: git rev-parse --short HEAD

  ARCH: "{{ARCH}}"

  CE_VERSION: "v{{ .CE_MAJOR }}.{{ .CE_MINOR }}"
  MANIFEST_TAG: "{{ .TAO_VERSION }}-{{ .CE_VERSION }}-{{ .CE_FLAVOR }}"
  SWIFT_DEV_TAG: dev-latest-{{ .CE_FLAVOR}}
  IMAGE_TAG: "{{ .IMAGE_TAG }}-{{ .ARCH }}"

  FULL_REGISTRY: "{{ .GCR }}/{{ .GCP_PROJECT }}/{{ .REMOTE_REGISTRY }}"
  FULL_IMAGE: "{{ .FULL_REGISTRY }}/{{ .SWIFT_IMAGE }}"

  FULL_MANIFEST_URL: "{{ .FULL_IMAGE }}:{{ .MANIFEST_TAG }}"
  LOCAL_IMAGE_URL: "{{ .LOCAL_IMAGE }}:{{ .SWIFT_DEV_TAG }}"
  FULL_IMAGE_URL: "{{ .FULL_MANIFEST_URL }}-{{ .ARCH }}"

  GOOGLE_TOKEN_FILE: .secrets/google_token

  MONOLITH_CONTEXTS:
        map:
          release: "{{.CACHE_DIR}}/swift/release" 

includes:
  monolith:
    taskfile: ../crystal
    dir: ../..
    vars:
      APP: tao-ce
      FILE: build/swift/Containerfile.d/monolith.in
      IMAGE: '{{.LOCAL_IMAGE}}'
      TAG: '{{.SWIFT_DEV_TAG}}'
      NAMESPACE: "-"
      TARGET: monolith
      CONTEXTS:
        ref: merge .APPS_CONTEXTS .MONOLITH_CONTEXTS

tasks:
  release:
    preconditions:
      - sh: test -n "$CE_MINOR"
      - sh: test -n "$CE_MAJOR"
      - sh: test -n "$TAO_VERSION"
    cmds:
    - rm -rf {{.CACHE_DIR}}/swift/release
    - mkdir -p {{.CACHE_DIR}}/swift/release
    - task: :all:gitref
    - cat {{.CACHE_DIR}}/versions/* >{{.CACHE_DIR}}/swift/release/versions.yml
    - echo {{.MANIFEST_TAG}}>{{.CACHE_DIR}}/swift/release/version
    - echo {{ARCH}}>{{.CACHE_DIR}}/swift/release/arch
    - date --utc -Is >{{.CACHE_DIR}}/swift/release/buildtime
    - git rev-parse HEAD >{{.CACHE_DIR}}/swift/release/gitref
    - git rev-parse --short HEAD >{{.CACHE_DIR}}/swift/release/gitrefshort
    - git remote get-url origin >{{.CACHE_DIR}}/swift/release/gitorigin
    - |
      cat >{{.CACHE_DIR}}/swift/release/environment <<EOF
      RELEASE_VERSION={{.MANIFEST_TAG}}-{{ARCH}}-$(cat {{.CACHE_DIR}}/swift/release/gitrefshort)
      EOF

  build:
    preconditions:
      - sh: test -n "$CE_MINOR"
      - sh: test -n "$CE_MAJOR"
      - sh: test -n "$TAO_VERSION"
    desc: Build swift container {{ .LOCAL_IMAGE }} from {{ .PAYLOAD_IMAGE }}
    deps:
    - :builds:base:build
    - :builds:go:build

    cmds:
    - pwd
    - task: :all:build
    - task: release
    - task: monolith:build

  login:
    preconditions:
      - sh: test -f {{ .GOOGLE_TOKEN_FILE }}
        msg: missing {{ .GOOGLE_TOKEN_FILE }}
    cmds:
    - |
      podman login \
        -u  oauth2accesstoken \
        --password-stdin {{ .GCR }} \
          <{{ .GOOGLE_TOKEN_FILE }}

      skopeo login \
        -u  oauth2accesstoken \
        --password-stdin {{ .GCR }} \
          <{{ .GOOGLE_TOKEN_FILE }}

  tag:
    preconditions:
      - sh: test -n "$CE_MINOR"
      - sh: test -n "$CE_MAJOR"
      - sh: test -n "$TAO_VERSION"
    requires:
      vars:
      - name: ARCH
        enum: [arm64, amd64]
    cmds:
    - |
      podman tag \
        {{ .LOCAL_IMAGE_URL }} \
        {{ .FULL_IMAGE_URL }}
  
  push:
    requires:
      vars:
      - CE_MINOR
      - CE_MAJOR
      - TAO_VERSION
    deps:
      - task: login
    cmds:
    - |
      podman push \
        {{ .FULL_IMAGE_URL }}

  manifest:
    requires:
      vars:
      - CE_MINOR
      - CE_MAJOR
      - TAO_VERSION
    deps:
      - task: login
    cmds:
    - |
      podman manifest create -a \
        {{ .FULL_MANIFEST_URL }} \
        {{ .FULL_MANIFEST_URL }}-amd64 \
        {{ .FULL_MANIFEST_URL }}-arm64
      
      podman push \
        {{ .FULL_MANIFEST_URL }}

