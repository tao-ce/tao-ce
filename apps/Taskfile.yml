version: '3'

method: checksum
output: prefixed
interval: 1s

includes:
  builds:
    taskfile: ../build/Taskfile.builds.yml

  construct:
    taskfile: ../build/crystal
    dir: construct
    vars:
      APP: construct
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-code: './src'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  content-service:
    taskfile: ../build/crystal
    dir: content-service
    vars:
      APP: content-service
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-backend: './src'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  deliver:
    taskfile: ../build/crystal
    dir: deliver
    vars:
      APP: deliver
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-backend: './src/be'
          src-frontend: './src/fe'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  devkit:
    taskfile: ../build/crystal
    dir: devkit
    vars:
      APP: devkit
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-backend: './src'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  datastore:
    taskfile: ../build/crystal
    dir: datastore
    vars:
      APP: datastore
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-worker: './src/node'
          src-assets: './assets'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  dynamic-query:
    taskfile: ../build/crystal
    dir: dynamic-query
    vars:
      APP: dynamic-query
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-api: './src'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'


  environment-management:
    aliases:
      - em
    taskfile: ../build/crystal
    dir: environment-management
    vars:
      APP: environment-management
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-auth-server: './src/node-auth-server'
          src-lti-gateway: './src/lti-gateway'
          src-sidecar: './src/server'
      BASES:
        - builds/base
        - builds/go
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'
          GO_BUILD_IMAGE: '{{.REGISTRY}}/builds/go:{{.DEV_TAG}}'

  portal:
    taskfile: ../build/crystal
    dir: portal
    vars:
      APP: portal
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-backend: './src/backend'
          src-frontend: './src/frontend'
          src-init: '../../libexec/init/portal'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  proctoring:
    taskfile: ../build/crystal
    dir: proctoring
    vars:
      APP: proctoring
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-forwarder: './src/apps/forwarder'
          src-frontend-auth-wait: './src/apps/frontend-auth-wait'
          src-frontend: './src/apps/frontend'
          src-lti13-gateway: './src/apps/lti13-gateway'
          src-realtime-service: './src/apps/realtime-service'
          src-go-shared: './src/apps/go-shared'
          src-protobuf: './src/apps/protobuf'
          src-apps: './src/apps/'
      BASES:
        - builds/base
        - builds/go
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'
          GO_BUILD_IMAGE: '{{.REGISTRY}}/builds/go:{{.DEV_TAG}}'

  scoring:
    taskfile: ../build/crystal
    dir: scoring
    vars:
      APP: scoring
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-ss: './src/tao-scoring-service-be'
          src-ms: './src/tao-manual-scoring-be'
          src-ms-fe: './src/tao-manual-scoring-fe'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  task-orchestrator:
    taskfile: ../build/crystal
    dir: task-orchestrator
    vars:
      APP: task-orchestrator
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-backend: './src'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'

  timers:
    taskfile: ../build/crystal
    dir: timers
    vars:
      APP: timers
      FILE: Containerfile.in
      CONTEXT: .
      CONTEXTS:
        map:
          src-backend: './src'
      BASES:
        - builds/base
      ARGS:
        map:
          BUILD_IMAGE: '{{.REGISTRY}}/builds/base:{{.DEV_TAG}}'
