name: 'build-devcontainer'

on: # rebuild any PRs and main branch changes
  # pull_request:
  push:
    # branches:
      # - main



jobs:
  build:

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        image: [build-base]
    runs-on: |
      ${{ fromJSON('{ "amd64": "ubuntu-24.04", "arm64": "ubuntu-24.04-arm" }')[matrix.arch] }}
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2 
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          target: build-base
          provenance: false
          context: .
          cache-from: type=gha,scope=build-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-base-${{ matrix.arch }}
          tags: |
            ghcr.io/tao-ce/tao-ce/build-base:${{ github.sha }}-${{ matrix.arch }}


  manifest:
    needs: [build]
    env:
      MANIFEST_URL: ghcr.io/tao-ce/tao-ce/build-base:${{ github.sha }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2 
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Push manifest
        run: |
          docker manifest create -a \
            ${{ env.MANIFEST_URL }} \
            ${{ env.MANIFEST_URL }}-arm64 \
            ${{ env.MANIFEST_URL }}-amd64

          docker manifest push \
            ${{ env.MANIFEST_URL }}


        
