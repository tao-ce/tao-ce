name: 'build-image'

on:
  workflow_call:
    inputs:
      namespace:
        required: false
        type: string
        default: ""
      image:
        required: true
        type: string
      target:
        required: false
        type: string
        default: export
      context:
        required: false
        type: string
        default: .
      build-args:
        required: false
        type: string
      build-contexts:
        required: false
        type: string
      inline-dockerfile:
        required: false
        type: string
        default: ''
      submodules:
        required: false
        type: string
        default: 'false'
    outputs:
      json:
        value: ${{ jobs.manifest.outputs.json }}

env:
  IMAGE_URL: |-
    ghcr.io/${{ github.repository }}${{ case( inputs.namespace == '','','/') }}${{ inputs.namespace }}${{ case(endsWith(inputs.namespace, '/'),'','/') }}${{ inputs.image}}
  

jobs:

  build:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    runs-on: |
      ${{ fromJSON('{ "amd64": "ubuntu-24.04", "arm64": "ubuntu-24.04-arm" }')[matrix.arch] }}

    outputs:
      meta-amd64: ${{ steps.out.outputs.meta_amd64 }}
      meta-arm64: ${{ steps.out.outputs.meta_arm64 }}
    steps:

      - name: Checkout (GitHub)
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - if: ${{ inputs.inline-dockerfile != '' }}
        run: |
          cat >Dockerfile <<"EODOCKERFILE"
          ${{ inputs.inline-dockerfile }}
          EODOCKERFILE

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_URL }}
          tags: |
            type=sha,format=long
            type=sha,format=short
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
      
      - id: out
        run: |
          cat <<EOF >>"$GITHUB_OUTPUT"
          meta_${{ matrix.arch }}=${{ steps.meta.outputs.json }}
          EOF

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          target: ${{ inputs.target }}
          provenance: mode=max
          sbom: true
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build-contexts }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=registry,ref=${{ env.IMAGE_URL }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,mode=max,ref=${{ env.IMAGE_URL }}:buildcache-${{ matrix.arch }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          # cache-from: type=gha,scope=build-${{ env.IMAGE_URL }}-${{ matrix.arch }}
          # cache-to: type=gha,mode=max,scope=build-${{ env.IMAGE_URL }}-${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}


  manifest:
    needs: [build]
    runs-on: ubuntu-latest

    outputs:
      json: ${{ steps.meta.outputs.json }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_URL }}
          tags: |
            type=sha,format=long
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Push manifest
        run: |
          for t in ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }} ; do
          docker buildx imagetools create \
            -t $t \
            ${{ fromJSON(needs.build.outputs.meta-amd64).tags[0] }} \
            ${{ fromJSON(needs.build.outputs.meta-arm64).tags[0] }}
          done 


