on: # rebuild any PRs and main branch changes
  push:



permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
          path: code

      - uses: actions/upload-artifact@v4
        with:
          path: code

  build-base:
    needs: [code]
    uses: ./.github/workflows/build-image.yml
    with:
      image: "base"
      namespace: "builds"
      target: "build-base"

  build-go:
    needs: [code]
    uses: ./.github/workflows/build-image.yml
    with:
      image: "go"
      namespace: "builds"
      target: "build-go"

  build-packages:
    needs: [build-base]
    uses: ./.github/workflows/build-image.yml
    with:
      image: npm
      namespace: packages
      submodules: recursive
      context: ./packages
      build-contexts:
        src-packages=./packages
        src-apps=./apps
      build-args: |
            BUILD_IMAGE=${{ fromJSON(needs.build-base.outputs.json).tags[0] }}
            GO_BUILD_IMAGE=${{ fromJSON(needs.build-go.outputs.json).tags[0] }}

  build-apps:
    needs: [build-base, build-go, build-packages]
    strategy:
      fail-fast: true
      matrix:
        include:
        - app: hierarchy
          context: ./apps/hierarchy
          build-contexts: |
            src-backend=./apps/hierarchy/src
        - app: timers
          context: ./apps/timers
          build-contexts: |
            src-backend=./apps/timers/src
        - app: devkit
          context: ./apps/devkit
          build-contexts: |
            src-backend=./apps/devkit/src
        - app: environment-management
          context: ./apps/environment-management
          build-contexts: |
            src-auth-server=./apps/environment-management/src/node-auth-server
            src-lti-gateway=./apps/environment-management/src/lti-gateway
            src-sidecar=./apps/environment-management/src/server
            src-packages=./packages
            src-apps=./apps
            hack=./hack
    uses: ./.github/workflows/build-image.yml
    with:
      image: "${{ matrix.app }}"
      submodules: 'recursive'
      namespace: "apps"
      context: "${{ matrix.context }}"
      build-contexts: "${{ matrix.build-contexts }}"
      build-args: |
            BUILD_IMAGE=${{ fromJSON(needs.build-base.outputs.json).tags[0] }}
            GO_BUILD_IMAGE=${{ fromJSON(needs.build-go.outputs.json).tags[0] }}
