name: Pilot Hierarchy Payload

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Override the pilot image tag
        required: false
        default: ""
        type: string
      build_env_image:
        description: Optional prebuilt container image to use as the job environment
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-hierarchy-payload-in-container:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.build_env_image }}
    env:
      APP: hierarchy
      DEFAULT_PILOT_TAG: gha-${{ github.run_id }}-container
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve pilot tag
        shell: bash
        run: |
          set -eu
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            tag="${DEFAULT_PILOT_TAG}"
          fi
          echo "PILOT_TAG=$tag" >>"$GITHUB_ENV"

      - name: Check required tools
        shell: bash
        run: |
          set -eux
          podman --version
          buildah --version

      - name: Install go-task
        uses: arduino/setup-task@v2

      - name: Build hierarchy payload in containerized environment
        shell: bash
        run: |
          set -eux
          task pilot:payload:build APP="${APP}" PILOT_TAG="${PILOT_TAG}"

      - name: Verify hierarchy payload contents in containerized environment
        shell: bash
        run: |
          set -eux
          task pilot:payload:verify APP="${APP}" PILOT_TAG="${PILOT_TAG}"

      - name: Inspect hierarchy payload image in containerized environment
        shell: bash
        run: |
          set -eux
          podman image inspect "localhost/tao-ce/apps/${APP}:${PILOT_TAG}" \
            --format '{{.Id}} {{range .RepoTags}}{{.}} {{end}}'
